<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실습 2-2</title>
</head>

<body>
    <h1>식물 키우기</h1>

    <button onclick = "green.giveLight(15)">빛 공급</button> :
    <span id = "light">0</span>
    &nbsp;  
    <button onclick = "green.giveWater(10)">수분 공급</button> :
    <span id = "water">0</span>
    <br>
    <br>
    <h3>성장 크기 : <span id = "treeSize">0</span></h3>
    <img src = "pot.png" height="30" id="myTree">

    <script>
        function tree() {
            this.light = 0;
            this.water = 0;
 
            this.giveLight = function (light) {
                this.light += light;                                      // light량 증가
                document.getElementById("light").innerHTML = this.light;  // 화면 표시
            };
 
            this.giveWater = function (water) {
                this.water += water;                                      // water량 증가
                document.getElementById("water").innerHTML = this.water;  // 화면 표시
            };
        }
 
        let green = new tree();
    </script>

</body>

</html>
