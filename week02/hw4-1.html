<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h2>1단계 계산</h2>
    <form>
    <input type="text" id="txt1" size="5" />
    +
    <input type="text" id="txt2" size="5" />
    <input type="button" value="계산" onclick="add1()" />
    <h2>결과 : <span id="total">0</span></h2>
</form>

    <script>
        function add1() {
            let a = document.getElementById("txt1").value;
            let b = document.getElementById("txt2").value;
            let result = Number(a) + Number(b);
            document.getElementById("total").innerHTML = result;
        }
    </script>

</body>
</html>
