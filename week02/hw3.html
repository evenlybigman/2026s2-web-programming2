<body>
    <script>
    function pr(a, b) {
        for (let i = 1; i <= b; i++) {
            for (let j = 0; j < i; j++) {
                document.writeln(a);
            }
            document.writeln("<br>");
        }
    }       
    </script>
    <script>
        pr("♡", 5);
    </script>
</body>
