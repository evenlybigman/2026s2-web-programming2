<form>
    <div id="number">0</div>
    <input type="button" value="count" onclick="tClick()">
    <input type="button" value="reset" onclick="tReset()">
</form>

<script>

let count = 0;

function tClick() {
    count++;
    document.getElementById("number").textContent = count;
}

function tReset() {
    count = 0;
    document.getElementById("number").textContent = count;
}

</script>
